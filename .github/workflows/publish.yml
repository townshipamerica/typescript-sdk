name: "Publish to npm"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). Without it npm cannot mint
      # a provenance statement and falls back to the token below.
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          # NO registry-url on purpose. setup-node would write an .npmrc with an
          # empty auth token, and npm treats that as "credentials present" —
          # which suppresses OIDC entirely and surfaces as a confusing 404 from
          # the registry. The token path below writes its own .npmrc if needed.

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) doesn't match package.json ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing townshipamerica@$PKG_VERSION"

      # Node 22 ships npm 10; trusted publishing needs >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # Trusted publishing (OIDC) — no secret anywhere in this repo. npm mints
      # the credential from the id-token above and attaches a signed provenance
      # statement; success looks like "Signed provenance statement with source
      # and build information from GitHub Actions" in the log, plus a Sigstore
      # transparency-log entry.
      #
      # The trust is configured on npmjs.com against this exact repository AND
      # workflow filename, with no environment. Renaming this file, moving the
      # job to an environment, or publishing from a fork will all fail here
      # until the trusted publisher is updated to match.
      - name: Publish to npm (trusted publishing)
        run: npm publish
